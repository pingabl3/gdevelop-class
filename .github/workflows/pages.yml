name: Build class page

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh game titles and screenshots from gd.games once a day.
    - cron: '0 17 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and publish are separate jobs (GitHub's recommended setup). Doing both in
  # one job sometimes failed with "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install image tools
        run: python3 -m pip install --quiet pillow
      - name: List projects
        run: python3 scripts/build_manifest.py
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html admin.js projects.json games.json _site/
          if [ -f config.json ]; then cp config.json _site/; fi
          mkdir -p _site/helpdesk && cp helpdesk/Code.gs _site/helpdesk/
          cp open.html _site/
          # Make browsers load the new admin.js after each update instead of a cached one.
          sed -i "s#'./admin.js'#'./admin.js?v=${GITHUB_SHA::7}'#" _site/index.html
          grep -q "admin.js?v=" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
