<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your GDevelop Project</title>
<style>
  :root {
    --bg: #f6f5fb; --card: #ffffff; --text: #1d1b2e; --muted: #5d5a73;
    --border: #e2e0ee; --accent: #5b3cf5; --accent-text: #ffffff; --soft: #eeeafe; --danger: #c42b4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14131c; --card: #1e1c2a; --text: #ecebf5; --muted: #a8a5bf;
      --border: #312e44; --accent: #8b74ff; --accent-text: #0f0d18; --soft: #2a2545; --danger: #ff7a93;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: var(--muted); margin: 0 0 18px; }
  ol { padding-left: 20px; margin: 0 0 20px; }
  li { margin-bottom: 6px; }
  a { color: var(--accent); }
  .btn { display: inline-block; border-radius: 8px; padding: 11px 18px; font-weight: 600; text-decoration: none; background: var(--accent); color: var(--accent-text); }
  .error { color: var(--danger); }
</style>
</head>
<body>
<main>
  <div class="card">
    <p class="muted" style="margin:0 0 6px">From your teacher</p>
    <h1 id="title">Your project</h1>
    <p id="status" class="muted">Checking the link…</p>
    <div id="ready" hidden>
      <ol>
        <li>Log in at <a href="https://editor.gdevelop.io" target="_blank" rel="noopener">editor.gdevelop.io</a> first.</li>
        <li>Click <strong>Open in GDevelop</strong> below.</li>
        <li>In GDevelop, choose <strong>File → Save as → GDevelop Cloud</strong> to keep it in your account.</li>
      </ol>
      <a id="open" class="btn" href="#">Open in GDevelop</a>
    </div>
  </div>
</main>
<script>
  window.addEventListener('hashchange', () => location.reload());
  const status = document.getElementById('status');
  const fail = msg => { status.textContent = msg; status.className = 'error'; };
  const m = decodeURIComponent(location.hash.slice(1)).match(/^([A-Za-z0-9-]{1,39})\/([0-9a-f]{20,40})$/);
  if (!m) {
    fail("This link isn't complete. Ask your teacher to send it again.");
  } else {
    const fileUrl = `https://gist.githubusercontent.com/${m[1]}/${m[2]}/raw/game.json`;
    fetch(fileUrl, { cache: 'no-store' })
      .then(r => {
        if (r.status === 404) throw new Error('gone');
        if (!r.ok) throw new Error('net');
        return r.json();
      })
      .then(project => {
        const name = (project.properties && project.properties.name) || 'Your project';
        document.getElementById('title').textContent = name;
        document.title = name;
        status.textContent = 'Your teacher shared this version of your project with you.';
        document.getElementById('open').href = 'https://editor.gdevelop.io/?project=' + encodeURIComponent(fileUrl);
        document.getElementById('ready').hidden = false;
      })
      .catch(e => fail(e.message === 'gone'
        ? 'This project link has been removed. Ask your teacher if you still need it.'
        : "Couldn't load the project. Check your internet connection and refresh the page."));
  }
</script>
</body>
</html>
